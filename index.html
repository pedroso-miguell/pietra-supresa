<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pra você, com carinho</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&display=swap"
    rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
  <noscript>
    <p style="position:fixed;left:0;right:0;top:40%;text-align:center;padding:2rem">Abra este arquivo no Safari ou no
      Chrome, e não pela prévia do WhatsApp ou do app Arquivos.</p>
  </noscript>
  <canvas id="fundo" aria-hidden="true"></canvas>

  <section class="ato on" id="a1">
    <p class="aviso" id="aviso">Chegou uma carta, escrita com todo o meu amor e carinho. Toque nela.</p>
    <div class="env" id="env" role="button" tabindex="0" aria-label="Abrir a carta">
      <div class="costas"></div>
      <div class="folha"></div>
      <div class="frente"></div>
      <div class="aba"></div>
      <div class="selo">&#9829;</div>
    </div>
    <article id="papel">
      <div id="texto"></div>
      <p class="script" id="ass"></p>
    </article>
    <button class="go oculto" id="b1">Continuar</button>
  </section>

  <section class="ato" id="a2">
    <p id="dica">Toque na estrela que está brilhando</p>
    <div class="cena" id="cena">
      <svg id="svgl" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <path id="linha" d="" />
      </svg>
    </div>
    <div id="final">
      <h2 class="script" id="tFinal"></h2>
      <p id="dias"></p>
      <p class="script ass" id="assF"></p>
    </div>
    <button class="go oculto" id="b2">Última surpresa</button>
  </section>
  <section id="tela" aria-live="polite">
    <svg id="flor" viewBox="0 0 300 480" aria-hidden="true"></svg>
    <p id="txt"></p>
    <button class="go oculto" id="seguir">Continuar</button>
  </section>

  <section class="ato" id="a3">
    <p class="script" id="pedido"></p>
    <div class="bolo" id="bolinho">
      <div class="prato"></div>
      <div class="andar a1"></div>
      <div class="andar a2"></div>
      <div class="andar a3"></div>
    </div>
    <button class="go" id="soprar">Soprar as velas</button>
    <button class="go oculto" id="b3">Uma última lembrança</button>
    <div id="parabens">
      <h2 class="script" id="hp"></h2>
      <p id="dp"></p>
      <p class="script ass" id="ap"></p>
    </div>
  </section>
  <section class="ato" id="a4">
    <h2 class="script" id="tFotos">Nossos momentos</h2>
    <div class="pilha" id="pilha"></div>
    <p id="dicaFotos">Toque na foto para ver a próxima</p>
  </section>
  <canvas id="conf" aria-hidden="true"></canvas>

  <script>
    window.onerror = function (m, s, l) {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99;background:#400;color:#fff;font:13px monospace;padding:8px';
      d.textContent = 'Erro: ' + m + ' (linha ' + l + ')';
      document.body.appendChild(d);
    };

    var NOME = "Pietra";
    var CONFIG = {
      nome: NOME,
      de: "Miguel",
      inicio: "2026-08-23", 
      carta:
        "Feliz aniversário, " + NOME + ".\n\n" +
        "Hoje é o dia em que o mundo ganhou você, e eu agradeço por isso mais do que consigo escrever.\n\n" +
        "Desde que a gente se conheceu, meus dias ganharam outra cor. Eu gosto do seu sorriso, da sua risada e do jeito que o tempo passa devagar quando estou do seu lado.\n\n" +
        "Fiz estas surpresas pensando em você, cada detalhe. Venha comigo.",
      mensagens: [
        "Uma flor pelo dia em que você chegou ao mundo.",
        "Outra pelo seu sorriso, que desarruma o meu dia do jeito mais bonito.",
        "Outra pelas conversas que parecem durar minutos e duram horas.",
        "Outra pela sua risada, que eu já reconheceria de longe.",
        "Outra por tudo que você me faz querer descobrir.",
        "E a última, para o seu novo ano: que seja o mais lindo de todos."
      ],
      final: "Seis flores para o seu novo ano",
      pedido: "Feche os olhos, faça um pedido e sopre as velas.",
      parabens: "Feliz aniversário, " + NOME + "!",
      desejo: "Que o seu novo ano seja leve, cheio de amor e de tudo que te faz feliz. Eu torço por você, sempre."
    };

    function $(id) { return document.getElementById(id); }
    function ir(n) {
      ['a1', 'a2', 'a3', 'a4'].forEach(function (id, i) { $(id).classList.toggle('on', i === n); });
    }

    $('ass').textContent = CONFIG.de;
    function abrirCarta() {
      var env = $('env');
      if (env.classList.contains('aberto')) return;
      env.classList.add('aberto');
      $('aviso').style.opacity = 0;
      setTimeout(function () { env.classList.add('some'); }, 1500);
      setTimeout(function () { $('papel').classList.add('on'); digitar(); chuva(); }, 2100);
    }
    $('env').onclick = abrirCarta;
    $('env').onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') abrirCarta(); };
    function digitar() {
      var t = CONFIG.carta, i = 0;
      (function passo() {
        i++;
        $('texto').textContent = t.slice(0, i);
        if (i < t.length) {
          var c = t.charAt(i - 1);
          setTimeout(passo, c === '\n' ? 350 : ('.,'.indexOf(c) >= 0 ? 220 : 40));
        } else {
          $('papel').classList.add('fim');
          setTimeout(function () { $('b1').classList.add('on'); }, 1500);
        }
        $('papel').scrollTop = 99999;
      })();
    }
    $('b1').onclick = function () { $('b1').classList.remove('on'); $('papel').classList.remove('on'); setTimeout(function () { ir(1); }, 600); };

    var PONTOS = [[50, 80], [17, 47], [30, 24], [50, 38], [70, 24], [83, 47]];
    var CORES = ['#ff7a9c', '#ffdca8', '#d7b5ff', '#ffb48a', '#fff1ef', '#ff6fb0'];
    var botoes = [], atual = 0, timers = [], TEMPO = 5.6;
    PONTOS.forEach(function (p, i) {
      var b = document.createElement('button');
      b.className = 'estrela'; b.style.left = p[0] + '%'; b.style.top = p[1] + '%';
      b.setAttribute('aria-label', 'Estrela ' + (i + 1));
      b.onclick = function () { abrir(i); };
      $('cena').appendChild(b); botoes.push(b);
    });
    botoes[0].classList.add('prox');

    function desenhar(ate, fechar) {
      var d = PONTOS.slice(0, ate + 1).map(function (p, i) { return (i ? 'L' : 'M') + p[0] + ' ' + p[1]; }).join(' ');
      $('linha').setAttribute('d', d + (fechar ? ' Z' : ''));
    }
    function criarFlor(cor) {
      function d(cls, a, t, extra, dd, tr) {
        return '<path class="d ' + cls + '" pathLength="1" style="--a:' + a + 's;--t:' + t + 's;' + (extra || '') + '"' + (tr ? ' transform="' + tr + '"' : '') + ' d="' + dd + '"/>';
      }
      var s = '', k;
      ['M150 420C138 436 118 442 96 452', 'M150 420C150 438 148 452 146 468', 'M150 420C162 436 184 440 206 450', 'M144 430C134 440 130 454 132 466'].forEach(function (p, i) { s += d('r', i * .15, .7, '', p); });
      s += d('v', .8, 1.5, 'fill:none', 'M150 420C170 340 130 260 150 160');
      s += d('v f', 1.9, .8, '', 'M146 335C110 305 78 311 64 327C88 349 124 351 146 335Z');
      s += d('v f', 2.2, .8, '', 'M152 275C188 245 222 249 238 265C214 289 178 291 152 275Z');
      for (k = 0; k < 8; k++) s += d('f', 2.9 + k * .2, .7, 'stroke:' + cor + ';fill:' + cor, 'M0 0C-22-20-24-62 0-78C24-62 22-20 0 0Z', 'translate(150 150) rotate(' + (k * 45) + ')');
      for (k = 0; k < 8; k++) s += d('f', 4.5 + k * .1, .5, 'stroke:#fff3e6;fill:#fff3e6', 'M0 0C-13-12-14-36 0-46C14-36 13-12 0 0Z', 'translate(150 150) rotate(' + (k * 45 + 22.5) + ')');
      return s + '<circle class="m" style="--a:' + (TEMPO - .4) + 's" cx="150" cy="150" r="14" fill="#ffdca8"/>';
    }
    function abrir(i) {
      atual = i;
      $('dica').style.opacity = 0;
      $('flor').innerHTML = criarFlor(CORES[i % CORES.length]);
      $('txt').textContent = CONFIG.mensagens[i];
      $('txt').classList.remove('on'); $('seguir').classList.remove('on');
      $('tela').classList.add('on');
      timers.forEach(clearTimeout);
      timers = [
        setTimeout(function () { $('txt').classList.add('on'); }, (TEMPO + .3) * 1000),
        setTimeout(function () { $('seguir').classList.add('on'); }, (TEMPO + 1.6) * 1000)
      ];
    }
    $('seguir').onclick = function () {
      var i = atual, l = $('linha');
      $('tela').classList.remove('on'); $('seguir').classList.remove('on');
      botoes[i].classList.remove('prox'); botoes[i].classList.add('feita');
      desenhar(i);
      if (i > 0 && l.getTotalLength) {
        var total = l.getTotalLength();
        l.style.transition = 'none'; l.style.strokeDasharray = total; l.style.strokeDashoffset = total * .25;
        requestAnimationFrame(function () { l.style.transition = 'stroke-dashoffset 1s'; l.style.strokeDashoffset = 0; });
      }
      if (i < PONTOS.length - 1) setTimeout(function () { botoes[i + 1].classList.add('prox'); }, 600);
      else setTimeout(finalizar, 1200);
    };
    function finalizar() {
      desenhar(PONTOS.length - 1, true);
      $('linha').style.strokeDasharray = 'none';
      var dias = Math.max(0, Math.floor((Date.now() - new Date(CONFIG.inicio + 'T00:00:00')) / 864e5));
      $('tFinal').textContent = CONFIG.final;
      $('dias').textContent = dias + ' dias desde que você apareceu na minha vida.';
      $('assF').textContent = CONFIG.de;
      setTimeout(function () { $('final').classList.add('on'); }, 1000);
      chuva();
      setTimeout(function () { $('b2').classList.add('on'); }, 6000);
    }
    $('b2').onclick = function () { $('b2').classList.remove('on'); ir(2); abrirBolo(); };

    var velas = [];
    function abrirBolo() {
      $('pedido').textContent = CONFIG.pedido;
      $('hp').textContent = CONFIG.parabens;
      $('dp').textContent = CONFIG.desejo;
      $('ap').textContent = CONFIG.de;
      [-4, -2, 0, 2, 4].forEach(function (dx) {
        var v = document.createElement('div');
        v.className = 'vela'; v.style.left = 'calc(50% + ' + dx + 'em)';
        v.innerHTML = '<i class="chama"></i>';
        $('bolinho').appendChild(v); velas.push(v);
      });
    }
    $('soprar').onclick = function () {
      $('soprar').disabled = true;
      velas.forEach(function (v, i) { setTimeout(function () { v.classList.add('off'); }, 500 + i * 380); });
      setTimeout(function () { $('a3').classList.add('festa'); confete(); }, 500 + velas.length * 380 + 600);
      setTimeout(function () { $('b3').classList.add('on'); }, 500 + velas.length * 380 + 6000);
    };

        });
        if (vivo) requestAnimationFrame(q); else x.clearRect(0, 0, c.width, c.height);
      })();
    }
